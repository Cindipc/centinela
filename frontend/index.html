<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#031219" />
    <script>
      // Aplica el tema antes del primer pintado: preferencia guardada o del sistema.
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('centinela-theme')
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#eef5f7' : '#031219'
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Centinela — Vigilancia del campus</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
